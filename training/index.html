<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>練球闖關</title>
<meta name="description" content="社工女排練球用：今天練球計時、關卡地圖、要領卡、體能計時器。">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="練球闖關">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="練球闖關">
<meta property="og:description" content="社工女排練球用：今天練球計時、關卡地圖、要領卡、體能計時器。">
<meta property="og:image" content="https://kenchen0728.github.io/Volleyball-defense/training/icons/og-image.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a37;--ink2:#4b5563;--line:#e5e7eb;--acc:#c2410c;--acc-ink:#fff;--soft:#f3f4f6;--ok:#15803d;--lock:#9ca3af;--sel:#1f2a37;--sel-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2128;--ink:#eef0f3;--ink2:#b4bcc6;--line:#2d343d;--acc:#f07a3e;--acc-ink:#1a0d05;--soft:#252b33;--ok:#4ade80;--lock:#6b7280;--sel:#eef0f3;--sel-ink:#111418}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0 8px;min-height:60px}
.top h1{font-size:20px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;font-size:15px}
.iconbtn{min-width:44px;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.hero{padding:24px 0 8px}
.hero .t{font-size:30px;font-weight:900;letter-spacing:1px}
.hero .s{color:var(--ink2);margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:16px;width:100%}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-size:18px;min-height:56px}
.row .btn{padding:0 8px;white-space:nowrap;gap:4px}
.btn.sm{min-height:44px;font-size:15px;width:auto}
.btn[aria-disabled=true]{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
h2{font-size:15px;font-weight:800;color:var(--ink2);letter-spacing:1px;margin:24px 0 8px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line)}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;min-height:64px}
.tile .bar{width:6px;align-self:stretch;border-radius:4px;flex:none}
.tile .m{flex:1;min-width:0}
.tile .n{font-weight:800;font-size:17px}
.tile .d{font-size:14px;color:var(--ink2);margin-top:1px}
.tile .go{color:var(--ink2);font-size:14px;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--c)}
.foot{margin-top:28px;font-size:13px;color:var(--ink2);text-align:center;line-height:1.8}
.foot button{background:none;border:none;text-decoration:underline;min-height:44px;padding:0 8px;font-size:14px;color:var(--ink2)}
/* 地圖 */
.mapsub{color:var(--ink2);font-size:14px;margin-bottom:6px}
.path{position:relative;padding:8px 0 8px}
.node{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;text-align:left;padding:10px 0;position:relative;min-height:76px}
.node .ring{flex:none;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;border:3px solid var(--line);background:var(--card);color:var(--lock);position:relative;z-index:1}
.node.done .ring{background:var(--c);border-color:var(--c);color:#fff}
.node.cur .ring{border-color:var(--c);color:color-mix(in srgb,var(--c) 70%,var(--ink));box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.node .tx{flex:1;min-width:0}
.node .nn{font-weight:800;font-size:17px}
.node.lock .nn{color:var(--ink2)}
.node .rr{font-size:13px;font-weight:700;color:color-mix(in srgb,var(--c) 70%,var(--ink));margin-top:2px}
.node.lock .rr{color:var(--lock)}
.node .st{font-size:13px;color:var(--ink2);white-space:nowrap}
.path:before{content:"";position:absolute;left:29px;top:40px;bottom:40px;width:4px;background:var(--line);border-radius:2px}
.path.zig:before{left:41px}
.badgebox{display:flex;align-items:center;gap:12px;padding:14px;margin-top:8px}
.badgebox .bt{font-weight:800}
.sect{padding:14px 16px;margin-top:10px}
.sect h3{font-size:16px;color:color-mix(in srgb,var(--c,var(--acc)) 70%,var(--ink));margin-bottom:6px}
.sect ul{list-style:none}
.sect li{position:relative;padding-left:14px;margin:4px 0;color:var(--ink)}
.sect li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--c,var(--acc))}
.sect p{color:var(--ink)}
.tag{display:inline-block;font-size:13px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:2px}
/* 參考卡 */
.item{padding:12px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nn{font-weight:800;font-size:17px}
/* 今天 */
.now{padding:16px;margin-top:4px}
.now .seg{font-size:14px;font-weight:800;color:var(--acc)}
.now .nm{font-size:26px;font-weight:900;margin-top:2px}
.now .note{color:var(--ink2);font-size:14px}
.clock{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:2px;margin:6px 0 2px;line-height:1.1}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.steps{margin-top:8px}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;min-height:52px}
.step .tm{font-variant-numeric:tabular-nums;font-weight:800;width:52px;flex:none;font-size:15px}
.step .mm{flex:1;min-width:0}
.step .sg{font-size:12px;color:var(--ink2)}
.step .dur{font-size:13px;color:var(--ink2);white-space:nowrap}
.step.done{opacity:.55}
.step.on{border:2px solid var(--acc)}
.timeset{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:12px}
.timeset input{font:inherit;min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;background:var(--sel);color:var(--sel-ink);border:none;border-radius:999px;padding:0 18px;min-height:48px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.mini span{font-variant-numeric:tabular-nums}
/* 體能 */
.seg3{display:flex;gap:6px;margin:4px 0 10px}
.seg3 button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;line-height:1.25;padding:4px}
.seg3 small{font-size:12px}
.seg3 button.sel{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.fig{display:flex;justify-content:center;background:var(--soft);border-radius:14px;padding:6px}
.fig svg{width:100%;max-width:300px;height:auto}
.phase{font-size:18px;font-weight:900;text-align:center;margin-top:10px}
.phase.rest{color:var(--ink2)}
.fitlist .item{display:flex;gap:10px;align-items:flex-start}
.fitlist .item svg{flex:none;width:96px;height:auto;background:var(--soft);border-radius:10px}
.k{font-weight:800;color:var(--ok)}
/* 底部視窗 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
@media (min-width:760px){.sheet{left:50%;right:auto;width:640px;bottom:auto;top:50%;border-radius:20px;transform:translate(-50%,-40%);opacity:0;transition:opacity .2s,transform .2s;max-height:86vh}.sheet.show{transform:translate(-50%,-50%);opacity:1}.grab{display:none!important}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sh-top{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;flex:none}
.sh-top h3{flex:1;font-size:18px;font-weight:900;min-width:0}
.sh-body{overflow:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.sh-act{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
.note-box{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.toast{width:max-content;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:50;background:var(--sel);color:var(--sel-ink);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;font-weight:700;max-width:calc(100% - 24px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast span{flex:1}
.toast button{white-space:nowrap;background:none;border:1.5px solid currentColor;border-radius:10px;min-height:44px;padding:0 12px;color:inherit;font-weight:800}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
/* 說明 */
.slide{padding:20px 18px;min-height:280px;touch-action:pan-y}
.slide img{display:block;width:100%;max-width:340px;margin:12px auto 0;border-radius:12px;border:1px solid var(--line)}
.banner{background:#fff4d6;color:#5b3a00;border-radius:12px;padding:10px 12px;font-size:15px;margin-top:12px}
@media (prefers-color-scheme:dark){.banner{background:#3a2c0a;color:#ffe6a6}}
.slide h3{font-size:20px;margin-bottom:8px}
.slide p,.slide li{font-size:16px;margin:6px 0}
.slide ul{padding-left:18px}
.pager{display:flex;align-items:center;gap:8px;margin-top:10px}
.pager .pg{flex:1;text-align:center;color:var(--ink2);font-size:14px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.toc button{min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:14px;font-weight:700}
.toc button.sel{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}

/* 練球模式 v2 */
.nowrow{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.nowrow .nm{flex:1;min-width:0;font-size:24px;line-height:1.25}
.nowrow .clock{font-size:48px;margin:0;letter-spacing:1px}
.todo{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.todo-h{font-weight:900;font-size:16px;margin-bottom:4px}
.todo-h span{font-weight:700;font-size:14px;color:var(--ink2);margin-left:8px}
.ls{list-style:none;counter-reset:ls;margin:4px 0}
.ls li{counter-increment:ls;display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:17px}
.ls li:last-child{border-bottom:none}
.ls li:before{content:counter(ls);flex:none;width:24px;height:24px;border-radius:50%;background:var(--c,var(--acc));color:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;align-self:center}
.ls .ln{flex:1;font-weight:700}
.ls .lc{font-size:15px;color:color-mix(in srgb,var(--c,var(--acc)) 70%,var(--ink));font-weight:800;text-align:right}
.ls-h{font-weight:900;margin-top:8px;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.ls-goal{font-size:14px;color:var(--ink2);margin-top:4px}
.nextup{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:12px;font-size:15px}
details.plan{margin-top:12px;padding:0 12px}
details.plan summary{min-height:48px;display:flex;align-items:center;font-weight:800;cursor:pointer}
details.plan .steps{margin:4px 0 12px}
details.plan .timeset{margin-top:0}
.item.lv{display:flex;gap:10px}
.lvn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}
.dia{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--soft);border-radius:12px;padding:10px;flex-wrap:wrap;justify-content:center}
.dia svg.ladder{width:150px;height:auto;color:var(--ink2)}
.dia .fp{transition:opacity .2s}
.dia-cap{font-size:14px;color:var(--ink2);flex:1;min-width:150px}
.dia-cap b{color:var(--ink)}
.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
.lg i{width:12px;height:16px;border-radius:50%;display:inline-block}
.poses{align-items:flex-start;gap:6px}
.pose{flex:1 1 90px;max-width:130px;text-align:center}
.pose svg{width:100%;height:auto}
.pose figcaption{font-size:13px;line-height:1.35;color:var(--ink)}
.pose figcaption b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#15803d;color:#fff;font-size:12px;align-items:center;justify-content:center;margin-right:2px}
.dia.team{flex-direction:column;align-items:stretch}
.team-svg{display:flex;justify-content:center;color:var(--ink)}
.team-svg svg{width:100%;max-width:260px;height:auto}
.team-cap{font-size:15px;min-height:4.8em}
.dia .row{width:100%}
@media (hover:hover){.tile:hover,.step:hover,.btn:hover{border-color:var(--ink2)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
// 練球闖關：內容資料（和 LINE 相簿的要領卡同一份內容）
const COMMON_RULE = "每輪重新算。過了往下一關，沒過留在同一關；同一關連續兩輪沒過，就退回前一關做一輪，找回感覺再上來。";

const SKILLS = [
 {id:"passhi", group:"基本功", name:"高手對傳", badge:"傳球穩穩", color:"#1f7a8c",
  sub:"約 7 分鐘｜兩人一組，單數就三人傳三角形",
  levels:[
   {n:"躺著推", r:"每人 10 顆", d:"搭檔從胸口高度放球，接住後往正上方推回去；前 5 顆停一下再推，後 5 顆接到就推"},
   {n:"蹲著接住再推", r:"10 顆", d:"蹲低接住、停一下，腳和手一起伸直，推給 3 公尺外的搭檔；站起來和推球要同時"},
   {n:"「接、推」兩拍", r:"10 顆", d:"還是先接再推，但停的時間越來越短"},
   {n:"連續對傳", r:"連續 20 下", d:"先站 3 公尺，穩了再拉到 4 到 5 公尺。過關：距離 3 公尺，連續對傳 20 下（兩人加起來），中間不停、球不掉，每一球都要高過頭一個手臂"},
  ],
  sections:[
   {t:"要領", li:[
    "<b>手型像碗</b>：放在額頭前上方一個拳頭的位置",
    "<b>腳先到、手先擺好</b>：先跑到球下面，等球掉進碗裡，手不要伸出去找球",
    "<b>像彈簧</b>：球往下掉時膝蓋微彎，球進手的那一刻，腳和手一起往上伸直、一起停；不是先站起來再用手推",
    "<b>推完手臂伸直</b>，指著目標",
    "<b>球不要轉</b>：會轉就是兩手不一樣大力"]},
   {t:"時間到", p:"時間到就停，沒過下次再試。過關的人：拉遠繼續練，或去幫學妹餵球、看動作。"}]},
 {id:"passlo", group:"基本功", name:"低手對傳", badge:"平台大師", color:"#2f8a4a",
  sub:"約 7 分鐘｜兩人一組",
  levels:[
   {n:"壓球跨步", r:"走 5 步換人", d:"搭檔雙手壓住她平台上的球、倒退走；她往前跨步蹲低，手臂不動，只用腳往上頂"},
   {n:"摸地板再接", r:"5 顆", d:"搭檔喊「嘿」→ 蹲下兩手摸地 → 回到預備姿勢 → 搭檔低手拋到腰前 → 墊回搭檔手上"},
   {n:"一拋一接", r:"5 顆", d:"不用摸地，直接墊回搭檔手上"},
   {n:"連續對墊", r:"連續 20 下", d:"球亂掉就接住，自己拋起來重新開始。過關：距離 3 公尺，連續對墊 20 下（兩人加起來），球要高過頭，搭檔一步之內接得到"},
  ],
  sections:[
   {t:"要領", li:[
    "<b>預備姿勢</b>：兩腳比肩寬、膝蓋彎、重心在前腳掌",
    "<b>平台</b>：手臂伸直併攏，用前臂接球，不要用手腕",
    "<b>蹲著等，碰到才送</b>：碰球那一刻膝蓋還是彎的，用腳往前上方送",
    "<b>手不甩</b>：打完手停在胸口以下，平台朝著目標"]},
   {t:"時間到", p:"時間到就停，沒過下次再試。過關的人：拉遠繼續練，或去幫學妹餵球、看動作。"}]},
 {id:"move", group:"基本功", name:"移動接球", badge:"腳步快手", color:"#d9572b",
  sub:"約 6 分鐘｜兩人一組，練低手",
  levels:[
   {n:"四個方向", r:"各 2 顆", d:"搭檔低手把球拋到她的左、右、前、後一步遠，大約腰的高度"},
   {n:"隨機方向", r:"10 顆過 7", d:"熟了以後不說方向，隨機拋。一組 10 顆，有 7 顆回到搭檔手上就過關（搭檔跨一步內接得到就算）；沒到 7 顆就換人，下次再挑戰"},
  ],
  sections:[
   {t:"要領", li:[
    "<b>先動腳</b>：移到球的後面站穩了再墊，不要伸手去撈",
    "<b>左右用側併步</b>，腳不要交叉",
    "<b>墊之前</b>，身體和平台先轉向搭檔"]}]},

 {id:"set", group:"專項", name:"舉球", badge:"舉球達人", color:"#3b5bb5",

const reduceMotion = () => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };

  ski: {t:"雙腳一起跳：格內 → 右邊格外 → 格內 → 左邊格外", s:[[["L",72,0],["R",88,0]],[["L",122,1],["R",138,1]],[["L",72,2],["R",88,2]],[["L",22,3],["R",38,3]],[["L",72,4],["R",88,4]]]},
  hop: {t:"格內單腳 → 下一格兩腳張開在格外 → 換另一腳", s:[[["L",80,0]],[["L",34,1],["R",126,1]],[["R",80,2]],[["L",34,3],["R",126,3]],[["L",80,4]]]},
  zig: {t:"雙腳一起，斜斜跳進格子、再斜斜跳到另一邊格外", s:[[["L",22,0],["R",38,0]],[["L",72,1],["R",88,1]],[["L",122,2],["R",138,2]],[["L",72,3],["R",88,3]],[["L",22,4],["R",38,4]]]},
};
function ladderSVG(key){
  const m = LADDER[key]; if(!m) return "";
  const cy = c => 196 - c*40;
  let g = `<rect x="56" y="16" width="48" height="200" fill="none" stroke="#9ca3af" stroke-width="3" rx="2"/>`;
  for(let i=1;i<5;i++) g += `<line x1="56" y1="${16+i*40}" x2="104" y2="${16+i*40}" stroke="#9ca3af" stroke-width="3"/>`;
  g += `<path d="M150 200 V40" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#lad-ar)"/><text x="152" y="30" font-size="11" fill="currentColor" text-anchor="middle">往前</text>`;
  m.s.forEach((step,k)=>{ step.forEach(([f,x,c,dy=0])=>{ const y = cy(c)+dy, col = f==="L"?FOOT_L:FOOT_R;
    g += `<g class="fp" data-k="${k}"><ellipse cx="${x}" cy="${y}" rx="7.5" ry="11" fill="${col}"/><text x="${x}" y="${y+4}" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">${k+1}</text></g>`; }); });
  const pair = m.s.some(s=>s.length>1);
  return `<div class="dia"><svg class="ladder" data-n="${m.s.length}" viewBox="0 0 170 226" role="img" aria-label="繩梯腳印圖：${m.t}"><defs><marker id="lad-ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>${g}</svg>
  <div class="dia-cap"><b>${m.t}</b><br><span class="lg"><i style="background:${FOOT_L}"></i>左腳</span><span class="lg"><i style="background:${FOOT_R}"></i>右腳</span>${pair?"<br>同一個數字＝兩腳一起":""}<br>數字是踩的順序</div></div>`;
}
let ladStep = 0;
setInterval(()=>{ const ls = document.querySelectorAll("svg.ladder"); if(!ls.length) return; ladStep++;
  ls.forEach(svg=>{ const n = +svg.dataset.n, cur = reduceMotion() ? n : ladStep % (n+2);
    svg.querySelectorAll(".fp").forEach(e=>{ const k = +e.dataset.k; e.style.opacity = k < cur ? 1 : .15; e.style.transform = ""; }); }); }, 650);

const TEAM_STEPS = [
 {c:"<b>1. 下面這隊（A）發球。</b>A 隊排第一個的人發，球發到對面。", hi:"serveA"},
 {c:"<b>2. 對面（B）接起來 → 舉球 → 攻擊打過來。</b>舉不到時，最近、又不是接第一球的人喊「修正」，把球送過網。", hi:"rally"},
 {c:"<b>3. A 發過了，球死了：A 隊後排轉一格。</b>5 號位的人下場，排到發球隊伍最後；6 → 5、1 → 6；剛發完的人進 1 號位。", hi:"rotA"},

];
function teamSVG(step){

  const tok = (x,y,t,col,dim) => `<g opacity="${dim?.35:1}"><circle cx="${x}" cy="${y}" r="13" fill="${col}"/><text x="${x}" y="${y+4.5}" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">${t}</text></g>`;

  let g = `<rect x="20" y="20" width="180" height="${H-40}" fill="none" stroke="#9ca3af" stroke-width="2.5"/><line x1="12" y1="${net}" x2="208" y2="${net}" stroke="currentColor" stroke-width="4"/><text x="214" y="${net+4}" font-size="10" fill="currentColor">網</text>

  // A 隊（下）：面向上，右邊是 1 號位
  const Ap = {s:[150,185], p5:[55,265], p6:[110,272], p1:[165,265]};
  const Bp = {s:[70,145], p5:[165,65], p6:[110,58], p1:[55,65]};
  const qA = [[150,316],[176,316],[202,316]], qB = [[70,14],[44,14],[18,14]];
  // 發球隊伍
  qA.forEach(([x,y],i)=>{ g += tok(x,y,i===0?"發":"A",A, hi==="serveB"||hi==="rally" ? false : false); });
  qB.forEach(([x,y],i)=>{ g += tok(x,y,i===0?"發":"B",B); });
  g += tok(...Ap.s,"舉",A) + tok(...Ap.p5,"5",A) + tok(...Ap.p6,"6",A) + tok(...Ap.p1,"1",A);
  g += tok(...Bp.s,"舉",B) + tok(...Bp.p5,"5",B) + tok(...Bp.p6,"6",B) + tok(...Bp.p1,"1",B);
  if(hi==="serveA") g += arr("M150 302 Q120 160 110 80");

  if(hi==="rotA") g += arr("M50 278 Q70 312 192 318","#2563eb") + arr("M98 272 H70","#2563eb") + arr("M152 268 H124","#2563eb") + arr("M150 302 L162 280","#2563eb");
  if(hi==="missA") g += arr("M150 302 Q130 250 118 ${net+8}".replace("${net+8}",net+8)) + `<text x="122" y="${net+28}" font-size="18" fill="#dc2626" font-weight="900">✕</text>` + arr("M150 330 Q180 336 214 322","#2563eb",true);
  if(hi==="serveB") g += arr("M70 28 Q100 170 110 252");

   <text x="4" y="${net-8}" font-size="11" fill="${B}" font-weight="800">B 隊</text><text x="4" y="${net+18}" font-size="11" fill="${A}" font-weight="800">A 隊</text></svg>`;
}

/* ---------- 聲音、震動、螢幕不休眠 ---------- */
let actx = null;
function unlockAudio(){ try{ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(freq=880, dur=.15, when=0, vol=.35){
  if(!actx || LS.get("mute", false)) return;
  try{ const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type="square"; o.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){}
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function alarmEnd(){ beep(988,.18,0); beep(988,.18,.25); beep(1319,.4,.5); buzz([200,100,200,100,400]); }
let wake = null;
async function wakeOn(){ try{ if(!wake && navigator.wakeLock){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null;}); } }catch(e){} }
function wakeOff(){ try{ wake && wake.release(); }catch(e){} wake=null; }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && (T.running || FT.running)) wakeOn(); });

/* ---------- 今天練球計時 ---------- */
const T = Object.assign({idx:0, running:false, endAt:0, remain:PLAN[0].m*60, day:""}, LS.get("timer", {}));
const todayStr = () => new Date().toISOString().slice(0,10);
if(T.day !== todayStr()){ Object.assign(T,{idx:0,running:false,endAt:0,remain:PLAN[0].m*60,day:todayStr()}); }
function tRemain(){ return T.running ? (T.endAt - Date.now())/1000 : T.remain; }
function tSave(){ LS.set("timer", T); }
function tStart(){ unlockAudio(); if(T.idx>=PLAN.length) return; T.endAt = Date.now() + T.remain*1000; T.running = true; tSave(); wakeOn(); }
function tPause(){ T.remain = Math.max(0,tRemain()); T.running = false; tSave(); if(!FT.running) wakeOff(); }
function tGo(i, keepRunning){ T.idx = Math.max(0, Math.min(PLAN.length, i)); T.remain = T.idx<PLAN.length ? PLAN[T.idx].m*60 : 0;
  if(keepRunning && T.idx<PLAN.length){ T.endAt = Date.now()+T.remain*1000; T.running = true; } else { T.running = false; }
  tSave(); }
function planStart(){ const s = LS.get("start","18:00").split(":"); return (+s[0])*60 + (+s[1]); }
function clockAt(i){ let m = planStart(); for(let k=0;k<i;k++) m += PLAN[k].m; return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }

/* ---------- 體能計時 ---------- */
const FT = {stage: LS.get("fitstage",0), seq:[], i:0, running:false, endAt:0, remain:0};
function ftBuild(){ const st = FIT_STAGES[FT.stage]; FT.seq = [];
  for(let r=0;r<st.rounds;r++) FITNESS.forEach((m,j)=>{ FT.seq.push({move:j, round:r, rest:false, d:st.on}); const last = r===st.rounds-1 && j===FITNESS.length-1; if(!last) FT.seq.push({move:(j+1)%FITNESS.length, round: j===FITNESS.length-1? r+1 : r, rest:true, d:st.off}); });
  FT.i = 0; FT.remain = FT.seq[0].d; FT.running = false; }
ftBuild();
const ftRemain = () => FT.running ? (FT.endAt-Date.now())/1000 : FT.remain;
function ftStart(){ unlockAudio(); if(FT.i>=FT.seq.length){ ftBuild(); } FT.endAt = Date.now()+FT.remain*1000; FT.running = true; wakeOn(); }
function ftPause(){ FT.remain = Math.max(0, ftRemain()); FT.running = false; if(!T.running) wakeOff(); }
function ftSkip(){ FT.i++; if(FT.i<FT.seq.length){ FT.remain = FT.seq[FT.i].d; if(FT.running) FT.endAt = Date.now()+FT.remain*1000; } else { FT.running=false; } }

let lastTick = {t:-1, f:-1};
setInterval(()=>{
  if(T.running && tRemain()<=0){
    // 螢幕關掉或切到別的 App 回來時，可能已經過了好幾項：照實際經過的時間一路算到現在這一項
    let end = T.endAt;
    while(T.idx < PLAN.length && end <= Date.now()){ T.idx++; if(T.idx < PLAN.length) end += PLAN[T.idx].m*60*1000; }
    if(T.idx >= PLAN.length){ T.running = false; T.remain = 0; } else { T.endAt = end; T.remain = (end-Date.now())/1000; }
    tSave(); alarmEnd(); toast(T.idx<PLAN.length ? "換下一項：" + PLAN[T.idx].n : "今天的練球結束了");
    if(!T.running && !FT.running) wakeOff(); render(); return; }
  if(FT.running){ const r = ftRemain(), sec = Math.ceil(r);
    if(sec<=3 && sec>0 && lastTick.f!==sec+FT.i*1000){ lastTick.f = sec+FT.i*1000; beep(660,.08); }
    if(r<=0){ let end = FT.endAt; ftSkip(); while(FT.i<FT.seq.length && end + FT.seq[FT.i].d*1000 <= Date.now()){ end += FT.seq[FT.i].d*1000; FT.i++; }
      if(FT.i<FT.seq.length){ FT.endAt = end + FT.seq[FT.i].d*1000; FT.remain = (FT.endAt-Date.now())/1000; }
      if(FT.i<FT.seq.length){ const s = FT.seq[FT.i]; s.rest ? (beep(523,.3),buzz(300)) : (beep(1047,.35),buzz([150,80,150])); } else { alarmEnd(); toast("體能完成，去收操"); if(!T.running) wakeOff(); } render(); return; } }
  updateLive();
}, 250);

function updateLive(){
  const c = $("#clock"); if(c){ c.textContent = fmt(tRemain()); const p = $("#progi"); if(p && T.idx<PLAN.length) p.style.width = (100 - tRemain()/(PLAN[T.idx].m*60)*100) + "%"; }

}

    requestAnimationFrame(()=>{ layer.querySelector(".scrim").classList.add("show"); layer.querySelector(".sheet").classList.add("show"); }); }
  if(opts.push) sheetStack.push({title, body, actions}); else sheetStack = [{title, body, actions}];

}
function paintSheet(){ const s = sheetStack[sheetStack.length-1], el = $("#layer .sheet"); if(!el) return;
  const back = sheetStack.length>1 ? `<button class="back" data-a="sheetback">‹ 返回</button>` : "";
  el.querySelector(".sh-top").innerHTML = `${back}<h3>${s.title}</h3><button class="iconbtn" data-a="sheetclose" aria-label="關閉">✕</button>`;
  el.querySelector(".sh-body").innerHTML = s.body; el.querySelector(".sh-body").scrollTop = 0;
  const act = el.querySelector(".sh-act"); act.innerHTML = s.actions || ""; act.style.display = s.actions ? "" : "none";
  const cb = el.querySelector("[data-a=sheetclose]"); if(cb) try{ cb.focus({preventScroll:true}); }catch(e){} }
function sheetBack(){ if(sheetStack.length>1){ sheetStack.pop(); paintSheet(); } else closeSheet(); }
function closeSheet(fromPop){ if(fromPop!==true && sheetStack.length && history.state && history.state.sheet){ sheetStack = []; history.back(); return; }
  const l = $("#layer"); const sc = l.querySelector(".scrim"), sh = l.querySelector(".sheet");
  sheetStack = []; if(!sh){ l.innerHTML=""; return; } sc.classList.remove("show"); sh.classList.remove("show"); setTimeout(()=>{ if(!sheetStack.length) l.innerHTML=""; }, 260); }
function dragClose(sh){ let y0=null, dy=0, ok=false;
  sh.addEventListener("touchstart",e=>{ const body = sh.querySelector(".sh-body"); ok = !body.contains(e.target) || body.scrollTop<=0; y0 = e.touches[0].clientY; dy=0; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(y0==null||!ok) return; dy = e.touches[0].clientY - y0; if(dy>0 && innerWidth<760){ sh.style.transition="none"; sh.style.transform=`translateY(${dy}px)`; } },{passive:true});
  sh.addEventListener("touchend",()=>{ sh.style.transition=""; sh.style.transform=""; if(ok && dy>90 && innerWidth<760) closeSheet(); y0=null; }); }
let toastTimer;
function toast(msg, label, fn){ let t = $("#toast"); if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${msg}</span>` + (label?`<button>${label}</button>`:""); if(label) t.querySelector("button").onclick = ()=>{ fn(); t.remove(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), label?6000:3000); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheetStack.length){ sheetBack(); } });

/* ---------- 畫面 ---------- */
function topbar(title, back="首頁", help){ return `<div class="top">${back?`<button class="back" ${back==="返回"?'data-a="hback"':'data-go=""'}>‹ ${back}</button>`:""}<h1>${title}</h1>${help!==undefined?`<button class="iconbtn" data-a="help:${help}" aria-label="這一頁怎麼用">?</button>`:""}</div>`; }
function miniBar(){ if(!(T.running || (T.idx>0 && T.idx<PLAN.length)) || location.hash==="#today") return "";
  return `<button class="mini" data-go="today">${T.running?ICON.play:ICON.pause}<span>${T.idx<PLAN.length?esc(PLAN[T.idx].n):""}</span><span id="minit">${fmt(tRemain())}</span> ›</button>`; }

function viewHome(){
  const groups = ["基本功","專項","發球"];
  const inApp = /Line\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent);
  let h = `<div class="hero" style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><div class="t">練球闖關</div><div class="s">社工女排｜帶隊計時、關卡和要領</div></div><button class="btn sm" data-a="help:0" style="margin-top:6px">使用說明</button></div>
  ${inApp?`<div class="banner"><b>現在是在 LINE 裡面打開</b>：不能加到主畫面。請按右上角選單，選「用預設瀏覽器開啟」。</div>`:""}
  <button class="btn pri" data-go="today">${ICON.play} 練球模式（帶隊計時）</button>`;
  h += `<h2>熱身</h2>`;
  ["warm1","warm2","warm3","warm4"].forEach(id=>{ h += refTile(id); });
  groups.forEach(g=>{ h += `<h2>${g}的關卡</h2>`;
    SKILLS.filter(s=>s.group===g).forEach(s=>{
      h += `<button class="tile" data-go="map-${s.id}" style="--c:${s.color}"><span class="bar" style="background:${s.color}"></span><span class="m"><span class="n">${s.name}</span><div class="d">${s.levels.length} 關：${s.levels.map(l=>l.n).join(" → ")}</div></span><span class="go">打開 ›</span></button>`; }); });
  h += `<h2>合練、團隊、體能</h2>`;
  ["combo","team1","team2","team3"].forEach(id=>{ h += refTile(id); });
  h += `<button class="tile" data-go="fitness"><span class="bar" style="background:#15803d"></span><span class="m"><span class="n">體能：肌力循環（計時器）</span><div class="d">七個動作，自動計時、換動作會響</div></span><span class="go">打開 ›</span></button>`;
  h += `<div class="foot"><button data-a="help:0">使用說明</button><button data-a="mute">${LS.get("mute",false)?"聲音：關":"聲音：開"}</button><br>
   練球闖關 ${VERSION}．有問題請跟教練說<br>© 2026 Ken Chen．只給社工女排練球使用</div>`;
  return `<div class="wrap">${h}</div>`;
}
function refTile(id){ const r = REFS[id];
  return `<button class="tile" data-go="ref-${id}"><span class="bar" style="background:${r.color}"></span><span class="m"><span class="n">${r.group}：${r.name}</span><div class="d">${r.sub}</div></span><span class="go">打開 ›</span></button>`; }

/* 一項的完整關卡和要領（關卡頁、練球模式的「看要領」共用） */
function skillBody(id, withTitle){
  const s = skillById(id);
  let h = `<div style="--c:${s.color}">${withTitle?`<h2 style="margin-top:12px">${s.name}</h2>`:""}`;
  if(s.intro) h += `<div class="card sect"><h3>怎麼分組</h3><ul>${s.intro.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  h += `<div class="card" style="margin-top:10px">` + s.levels.map((l,i)=>`<div class="item lv"><div class="lvn">${i+1}</div><div style="flex:1;min-width:0"><div class="nn">${l.n}<span class="tag">${l.r}</span></div><div>${l.d}</div>${l.x?`<div class="sect" style="padding:4px 0 0"><ul>${l.x.map(y=>`<li>${y}</li>`).join("")}</ul></div>`:""}</div></div>`).join("") + `</div>`;
  s.sections.forEach(x=>{ h += `<div class="card sect"><h3>${x.t}</h3>${x.li?`<ul>${x.li.map(y=>`<li>${y}</li>`).join("")}</ul>`:`<p>${x.p}</p>`}</div>`; });
  h += `<div class="card sect"><h3>過關規則</h3><p>${COMMON_RULE}</p></div>`;
  return h + `</div>`;
}
function viewMap(id){
  const s = skillById(id); if(!s) return viewHome();
  return `<div class="wrap">${topbar(`${s.group}：${s.name}`, "首頁", 2)}<div class="mapsub">${s.sub}</div>${skillBody(id)}</div>`;
}

function refBody(r){
  let h = `<div style="--c:${r.color}">`;
  h += `<div class="card">` + r.items.map(([n,c,li,dia])=>`<div class="item"><div class="nn">${n}${c?`<span class="tag">${c}</span>`:""}</div>${li.length?`<div class="sect" style="padding:4px 0 0"><ul>${li.map(y=>`<li>${y}</li>`).join("")}</ul></div>`:""}${diagram(dia)}</div>`).join("") + `</div>`;
  (r.extra||[]).forEach(([t,li])=>{ h += `<div class="card sect"><h3>${t}</h3><ul>${li.map(y=>`<li>${y}</li>`).join("")}</ul></div>`; });
  return h + `</div>`;
}
function viewRef(id){ const r = REFS[id]; if(!r) return viewHome();
  return `<div class="wrap">${topbar(`${r.group}：${r.name}`, "首頁", 0)}<div class="mapsub">${r.sub}</div>${refBody(r)}</div>`; }

/* 練球模式：這一段要做什麼（只列名稱和次數） */
function segList(s){
  if(s.skill || s.skills){ const ids = s.skills || [s.skill];
    return ids.map(id=>{ const k = skillById(id);
      return `${ids.length>1?`<div class="ls-h" style="--c:${k.color}">${k.name}</div>`:""}<ol class="ls" style="--c:${k.color}">${k.levels.map(l=>`<li><span class="ln">${l.n}</span><span class="lc">${l.r}</span></li>`).join("")}</ol>`; }).join("")
      + `<div class="ls-goal">一關過了就往下一關；到最後一關就一直練到鈴響（可以拉遠距離，或去幫學妹）</div>`; }
  if(s.refs) return `<ol class="ls"><li><span class="ln">先發到齊</span><span class="lc">輪轉＋比賽</span></li><li><span class="ln">沒到齊</span><span class="lc">接發球＋修正 或 防守＋轉攻</span></li></ol>`;
  if(s.fitness) return `<ol class="ls" style="--c:#15803d">${FITNESS.map(m=>`<li><span class="ln">${m.n}</span><span class="lc">${m.c}</span></li>`).join("")}</ol><button class="btn" data-go="fitness" style="margin-top:8px">打開體能計時器 ›</button>`;
  const r = REFS[s.ref];
  return `<ol class="ls" style="--c:${r.color}">${r.items.map(([n,c])=>`<li><span class="ln">${n}</span><span class="lc">${c}</span></li>`).join("")}</ol>`;
}
function viewToday(){
  let h = topbar("練球模式", "首頁", 1);
  if(T.idx>=PLAN.length){ h += `<div class="card now" style="text-align:center"><div class="nm">今天練完了</div><p style="color:var(--ink2);margin:6px 0 12px">辛苦了，記得收操、喝水。</p><button class="btn" data-a="trestart">從頭再來一次</button></div>`; }
  else { const s = PLAN[T.idx], r = tRemain(), nx = PLAN[T.idx+1];
    h += `<div class="card now"><div class="seg">${s.seg}．${clockAt(T.idx)} 開始．${s.m} 分鐘</div>
    <div class="nowrow"><div class="nm">${s.n}</div><div class="clock" id="clock" aria-live="off">${fmt(r)}</div></div>
    <div class="prog"><i id="progi" style="width:${100 - r/(s.m*60)*100}%"></i></div>
    <div class="row"><button class="btn" data-a="tprev" aria-label="上一項" ${T.idx===0?'aria-disabled="true"':""}>${ICON.prev} 上一項</button>
    <button class="btn pri" data-a="ttoggle" style="flex:1.4">${T.running?ICON.pause+" 暫停":ICON.play+(T.remain<s.m*60?" 繼續":" 開始")}</button>
    <button class="btn" data-a="tnext" aria-label="下一項">下一項 ${ICON.next}</button></div>
    <div class="todo"><div class="todo-h">這一段做什麼${s.note&&!s.refs?`<span>${s.note}</span>`:""}</div>${segList(s)}</div>
    <button class="btn" data-a="how:${T.idx}" style="margin-top:10px">看要領和示意圖 ›</button>
    <div class="nextup">${nx?`下一項：<b>${nx.n}</b>．${nx.m} 分鐘`:"這是最後一項"}</div></div>`; }
  h += `<details class="card plan"${T.idx>=PLAN.length?" open":""}><summary>今天的流程（點了可以跳到那一項）</summary>
   <div class="timeset">開始時間 <input type="time" id="startT" value="${LS.get("start","18:00")}"></div>
   <div class="steps">` + PLAN.map((s,i)=>`<button class="step ${i<T.idx?"done":""} ${i===T.idx?"on":""}" data-a="tjump:${i}"><span class="tm">${clockAt(i)}</span><span class="mm"><div class="sg">${s.seg}</div><div>${i<T.idx?"✓ ":""}${s.n}</div></span><span class="dur">${s.m} 分</span></button>`).join("") + `</div></details>`;
  h += `<div class="note-box">時間到會響三聲、自動換下一項，時間一直跑，看要領時也不會停（iPhone 要關掉靜音才聽得到）。螢幕如果會暗，請到手機設定把自動鎖定調長。</div>`;
  return `<div class="wrap">${h}</div>`;
}
function howSheet(i){ const s = PLAN[i];
  if(s.skill || s.skills){ const ids = s.skills || [s.skill];
    openSheet(s.n, ids.map(id=>skillBody(id, ids.length>1)).join(""), ""); return; }
  if(s.refs){ openSheet(s.n, `<p style="color:var(--ink2);margin-bottom:8px">先發到齊練「輪轉＋比賽」，沒到齊練另外兩張</p>` + s.refs.map(id=>`<button class="tile" data-a="refsheet:${id}"><span class="bar" style="background:${REFS[id].color}"></span><span class="m"><span class="n">${REFS[id].name}</span><div class="d">${REFS[id].sub}</div></span><span class="go">打開 ›</span></button>`).join(""), ""); return; }
  if(s.fitness){ openSheet(s.n, `<p>用體能計時器，自動做、休息、換動作。</p>`, `<button class="btn pri" data-go="fitness">打開體能計時器</button>`); return; }
  const r = REFS[s.ref]; openSheet(`${r.group}：${r.name}`, `<div class="mapsub">${r.sub}</div>` + refBody(r), "");
}

function viewFitness(){
  const st = FIT_STAGES[FT.stage], cur = FT.seq[Math.min(FT.i, FT.seq.length-1)], m = FITNESS[cur.move], done = FT.i>=FT.seq.length;
  let h = topbar("體能．肌力循環", "首頁", 1);
  h += `<div class="seg3" role="radiogroup" aria-label="加量階段">${FIT_STAGES.map((x,i)=>`<button role="radio" aria-checked="${i===FT.stage}" class="${i===FT.stage?"sel":""}" data-a="fstage:${i}">${i===FT.stage?"✓ ":""}${x.s}<br><small>${x.on}／${x.off} 秒．${x.rounds} 輪</small></button>`).join("")}</div>`;
  if(done){ h += `<div class="card now" style="text-align:center"><div class="nm">做完了</div><p style="color:var(--ink2);margin:6px 0 12px">去收操吧（照隊上原本那一套）。</p><button class="btn" data-a="freset">再做一次</button></div>`; }
  else { const nth = FITNESS.indexOf(m)+1;
    h += `<div class="card now"><div class="seg">第 ${cur.round+1}／${st.rounds} 輪．動作 ${nth}／${FITNESS.length}</div>
    <div class="phase ${cur.rest?"rest":""}">${cur.rest?"休息，下一個：":"做"}</div><div class="nm" style="text-align:center">${m.n}<span class="tag" style="--c:#15803d">${m.c}</span></div>
    <div class="fig" style="margin-top:8px">${fig(m.f)}</div>
    <div class="clock" id="fclock">${fmt(ftRemain())}</div>
    <div class="row"><button class="btn" data-a="freset">重來</button><button class="btn pri" data-a="ftoggle" style="flex:1.6">${FT.running?ICON.pause+" 暫停":ICON.play+" 開始"}</button><button class="btn" data-a="fskip">跳過 ${ICON.next}</button></div>
    <div class="note-box"><span class="k">重點</span>　${m.k}<br><span class="k">痠哪裡才對</span>　${m.s}<br><span class="k">簡單版</span>　${m.e}</div></div>`; }
  h += `<div class="card sect"><h3 style="color:#15803d">怎麼做</h3><ul style="--c:#15803d">
   <li style="--c:#15803d">先做簡單版，慢慢做：下去數兩秒、上來數兩秒，不用拚次數</li><li>痠在對的地方就是做對了；痠錯地方就停下來看重點</li><li>彈力帶兩人一條，放在最後兩站輪流</li><li>第一週會痠，痠到動作做不好就少做幾下；比賽前一週減半</li></ul></div>`;
  h += `<h2>七個動作</h2><div class="card fitlist">` + FITNESS.map((x,i)=>`<div class="item">${fig(x.f)}<div><div class="nn">${i+1}．${x.n}<span class="tag" style="--c:#15803d">${x.c}</span></div><div style="font-size:14px">${x.k}</div><div style="font-size:14px;color:var(--ink2)">痠：${x.s}．簡單版：${x.e}</div></div></div>`).join("") + `</div>`;
  return `<div class="wrap">${h}</div>`;
}

const HELP = [
 ["這是什麼", `<p>練球用的小幫手，主要給<b>帶隊的人</b>拿著看。</p><ul><li>首頁最上面：<b>練球模式</b>，照表定時間計時</li><li>下面：熱身、基本功、專項、發球的<b>關卡和要領</b>，團隊和體能也在這裡</li><li>隊員也可以自己打開來看怎麼做</li></ul>`, "home"],
 ["練球模式", `<ul><li>按<b>開始</b>，右上的大數字倒數這一段剩下的時間</li><li>下面「這一段做什麼」列出每一關和次數：開始前看著念一次，就讓大家自己往下練</li><li>時間到會響三聲，自動換下一項；最下面寫著下一項是什麼</li><li>忘記怎麼做就按<b>看要領和示意圖</b>，時間不會停</li><li>點「今天的流程」可以跳到任何一項；iPhone 要關掉靜音才聽得到聲音</li></ul>`, "today"],
 ["關卡和示意圖", `<ul><li>每一項都有幾關，由簡單到難，過了就往下一關</li><li>到最後一關就一直練到鈴響，可以拉遠距離</li><li>繩梯有<b>腳印動畫</b>，數字是踩的順序；專項起跳有<b>分解動作圖</b></li><li>團隊「接發球＋修正」有<b>一步一步的流程圖</b>，按下一步看誰發球、誰轉位置</li></ul>`, "map"],
 ["加到主畫面", `<p>加到主畫面後，就像 App 一樣點圖示打開，沒有網路也能用。</p><ul><li><b>iPhone、iPad</b>：用 Safari 打開 → 下面的分享鈕 → 「加入主畫面」</li><li><b>Android</b>：用 Chrome 打開 → 右上角 ⋮ → 「加到主畫面」或「安裝應用程式」</li><li><b>電腦、Chromebook</b>：用 Chrome 或 Edge 打開 → 網址列右邊的安裝圖示</li><li>從 LINE 點連結會用 LINE 裡面的瀏覽器打開，不能加到主畫面：請按右上角改用 Safari 或 Chrome 打開</li></ul>`],
];
let helpI = 0, helpFrom = "";
function viewHelp(){
  return `<div class="wrap">${topbar("使用說明", helpFrom ? "返回" : "首頁")}<div class="toc">${HELP.map((x,i)=>`<button class="${i===helpI?"sel":""}" data-a="help:${i}">${x[0]}</button>`).join("")}</div>
  <div class="card slide" id="slide"><h3>${HELP[helpI][0]}</h3>${HELP[helpI][1]}${HELP[helpI][2]?`<img src="help/${HELP[helpI][2]}.webp" alt="${HELP[helpI][0]}的畫面" loading="lazy" onerror="this.remove()">`:""}</div>
  <div class="pager"><button class="btn sm" data-a="help:${helpI-1}" ${helpI===0?'aria-disabled="true"':""}>‹ 上一張</button><div class="pg">${helpI+1}／${HELP.length}</div><button class="btn sm" data-a="help:${helpI+1}" ${helpI===HELP.length-1?'aria-disabled="true"':""}>下一張 ›</button></div></div>`;
}

function render(){
  const hsh = location.hash.slice(1);
  let html;
  if(hsh==="today") html = viewToday();
  else if(hsh==="fitness") html = viewFitness();
  else if(hsh==="help") html = viewHelp();
  else if(hsh.startsWith("map-")) html = viewMap(hsh.slice(4));
  else if(hsh.startsWith("ref-")) html = viewRef(hsh.slice(4));
  else html = viewHome();
  $("#app").innerHTML = html + miniBar();
  const sl = $("#slide"); if(sl){ let x0=null; sl.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true}); sl.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50){ const n = helpI + (dx<0?1:-1); if(n>=0 && n<HELP.length){ helpI=n; render(); } } }); }
  const st = $("#startT"); if(st) st.onchange = ()=>{ if(/^\d\d:\d\d$/.test(st.value)){ LS.set("start", st.value); render(); } };
}
let lastHash = location.hash;
window.addEventListener("popstate", ()=>{ if(sheetStack.length || $("#layer .sheet")){ if(sheetStack.length>1){ sheetStack.pop(); paintSheet(); try{ history.pushState({sheet:1},""); }catch(e){} } else closeSheet(true); } });
window.addEventListener("hashchange", ()=>{ closeSheet(true); if(location.hash!==lastHash){ lastHash = location.hash; render(); scrollTo(0,0); } });
function go(h){ unlockAudio(); if(sheetStack.length){ try{ if(history.state && history.state.sheet) history.replaceState(null,""); }catch(e){} closeSheet(true); } if(("#"+h)===location.hash || (h===""&&location.hash==="")){ render(); return; } location.hash = h; if(h===""){ history.replaceState(null,"",location.pathname+location.search); lastHash=""; render(); scrollTo(0,0);} }

let lock = 0;
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const el = e.target.closest("[data-a]"); if(!el) return;
  if(el.getAttribute("aria-disabled")==="true") return;
  const [a, x, y] = el.dataset.a.split(":"); unlockAudio();
  const now = Date.now(); if(now - lock < 350 && ["tnext","tprev","fskip","tstep"].includes(a)) return; lock = now;
  switch(a){
   case "sheetclose": closeSheet(); break;
   case "sheetback": sheetBack(); break;
   case "help": helpI = Math.max(0,Math.min(HELP.length-1,+(x||0))); if(location.hash!=="#help"){ helpFrom = location.hash.slice(1); go("help"); } else render(); break;
   case "hback": { const f = helpFrom; helpFrom = ""; go(f); break; }
   case "mute": LS.set("mute", !LS.get("mute",false)); render(); break;
   case "tstep": { teamStep = Math.max(0, Math.min(TEAM_STEPS.length-1, +x)); document.querySelectorAll("#teamdia").forEach(e=>e.outerHTML = teamPlayer()); break; }
   case "ttoggle": T.running ? tPause() : tStart(); render(); break;
   case "tnext": tGo(T.idx+1, T.running); render(); break;
   case "tprev": tGo(T.idx-1, T.running); render(); break;
   case "tjump": tGo(+x, false); render(); scrollTo(0,0); break;
   case "trestart": tGo(0,false); render(); break;
   case "how": howSheet(+x); break;
   case "refsheet": { const r = REFS[x]; openSheet(r.name, `<div class="mapsub">${r.sub}</div>` + refBody(r), "", {push:true}); break; }
   case "fstage": if(+x!==FT.stage){ FT.stage=+x; LS.set("fitstage",FT.stage); ftBuild(); if(!T.running) wakeOff(); } render(); break;
   case "ftoggle": FT.running ? ftPause() : ftStart(); render(); break;
   case "fskip": ftSkip(); render(); break;
   case "freset": ftBuild(); if(!T.running) wakeOff(); render(); break;
  }
});
render();
try{ if("serviceWorker" in navigator && location.hostname.endsWith("github.io")) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
