<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>練球手冊</title>
<meta name="description" content="社工女排練球手冊：每一段怎麼練、要領和示意圖，練球前預習、練完複習。">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="練球手冊">

<meta property="og:title" content="練球手冊">
<meta property="og:description" content="社工女排練球手冊：每一段怎麼練、要領和示意圖，練球前預習、練完複習。">
<meta property="og:image" content="https://kenchen0728.github.io/Volleyball-defense/training/icons/og-image.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a37;--ink2:#4b5563;--line:#e5e7eb;--line2:#9ca3af;--acc:#c2410c;--acc-ink:#fff;--soft:#f3f4f6;--court:#fbf7ef;--courtline:#8b8f96}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2128;--ink:#eef0f3;--ink2:#b4bcc6;--line:#2d343d;--line2:#6b7280;--acc:#f07a3e;--acc-ink:#1a0d05;--soft:#252b33;--court:#20262e;--courtline:#9aa3ad}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 0 8px;min-height:60px;border-bottom:1px solid transparent}
.top.sh{border-bottom-color:var(--line)}
.top h1{font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 8px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.hero{padding:calc(20px + env(safe-area-inset-top)) 0 6px}
.hero .t{font-size:30px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.hero .s{color:var(--ink2);margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:16px;width:100%;text-align:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-size:18px;min-height:58px;margin-top:14px}
.btn.pri small{font-weight:600;opacity:.9;font-size:14px}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:0 12px}
h2{font-size:15px;font-weight:800;color:var(--ink2);letter-spacing:1px;margin:22px 0 8px}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;min-height:64px}
.tile .bar{width:6px;align-self:stretch;border-radius:4px;flex:none}
.tile .m{flex:1;min-width:0}
.tile .n{font-weight:800;font-size:17px}
.tile .n small{font-weight:700;font-size:13px;color:var(--ink2);margin-left:6px}
.tile .n,.tile .d{display:block}
.tile .d{font-size:14px;color:var(--ink2);margin-top:1px}
.tile .go{color:var(--ink2);font-size:14px;font-weight:700;white-space:nowrap}
.note{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--acc));border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.note li{margin:2px 0 2px 18px}
.note p+p{margin-top:4px}
.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.sect h3{font-size:16px;font-weight:800;color:color-mix(in srgb,var(--c,var(--acc)) 70%,var(--ink));margin-bottom:6px}
.sect ul,.sect ol{padding-left:20px}
.sect li{margin:4px 0}
.sect li::marker{color:color-mix(in srgb,var(--c,var(--acc)) 75%,var(--ink));font-weight:800}
.mv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.mv .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mv .num{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:14px;background:var(--c);color:#fff;font-weight:900;font-size:15px;padding:0 6px;align-self:center}
.mv .nn{font-weight:800;font-size:17px}
.mv .cnt{font-weight:800;font-size:15px;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.mv .tg{font-size:12px;font-weight:800;border:1.5px solid var(--line2);border-radius:999px;padding:0 8px;color:var(--ink2)}
.mv ul{padding-left:20px;margin-top:6px}
.mv li{margin:3px 0}
.src{font-size:13px;color:var(--ink2);margin-top:8px}
.warn{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);border:1.5px dashed var(--line2)}
/* 示意圖 */
.dia{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--soft)}
.dia svg{display:block;width:100%;height:auto;max-height:430px;color:var(--ink)}
.dia .cap{font-size:14px;color:var(--ink);margin-top:6px;text-align:center;min-height:2.6em}
.dia .lg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:13px;color:var(--ink2);margin-top:4px}
.dia .lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.ctl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.ctl .btn{flex:1 1 0;min-width:84px;width:auto;min-height:44px;font-size:15px;padding:0 8px}
.ctl .btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctl .pg{flex:0 0 auto;align-self:center;font-size:14px;color:var(--ink2);min-width:52px;text-align:center}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg .btn{min-height:44px;font-size:15px}
.seg .btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.poses{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.poses figure{flex:1 1 0;min-width:92px;max-width:170px;text-align:center}
.poses figcaption{font-size:13px;color:var(--ink);line-height:1.4}
.poses figcaption b{display:inline-block;min-width:20px;border-radius:10px;background:#15803d;color:#fff;font-size:12px;margin-right:2px}
.fp{transition:opacity .2s ease-out}
.fp.cur .ring{opacity:1}
.fp .ring{opacity:0}
@media (prefers-reduced-motion:reduce){.fp{transition:none}}
/* 今天 */
.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pl{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;min-height:56px}
.pl:last-child{border-bottom:none}
.pl .tm{font-weight:900;font-variant-numeric:tabular-nums;min-width:48px;color:var(--ink2)}
.pl .bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
.pl .m{flex:1;min-width:0}
.pl .n{font-weight:800}
.pl .n small{font-weight:700;color:var(--ink2);margin-left:4px;font-size:13px}
.pl .d{font-size:14px;color:var(--ink2)}
.pl .go{color:var(--ink2);font-weight:700;font-size:14px;align-self:center}
.navnext{margin-top:18px}
.foot{margin-top:28px;font-size:13px;color:var(--ink2);text-align:center;line-height:1.8}
.foot .lk{background:var(--card);border:1.5px solid var(--line2);border-radius:12px;min-height:44px;padding:0 14px;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:50;background:var(--ink);color:var(--bg);border:none;border-radius:999px;min-height:44px;padding:0 18px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
@media (hover:hover){.tile:hover,.pl:hover{background:var(--soft)}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (min-width:900px){.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const VERSION = "2026.11.24.1";

/* ===================== 內容 ===================== */
// 今天的流程（每次練球前請 Claude 改這一段）
const TODAY = {date:"11/24（二）", rows:[
 ["18:00","warm","熱身","20分","18:20 一到就停，沒做完的跳過"],
 ["18:20","basic","基本功","20分","高手、低手各 10 分鐘"],
 ["18:40","serve","發球","10分","低手發球；連續十顆過網可以找教練學高手"],
 ["18:50","block","攔網","10分","原地跳 → 側併一步跳 → 攔網接力"],
 ["19:00","split","分組","15分","舉球組／攻擊組"],
 ["19:15","combo","舉攻合練","15分","先推三個標誌盤，都推到才攻擊"],
 ["19:30","team","團隊","40分","接扣隊形先跑一輪（19:55 前跑完再練接發球）"],
 ["20:10","fit","體能","15分","第一次：先教動作"],
 ["20:25","cool","收操","5分","照隊上那套"]
]};

/* 每一段：items 裡每一項是一頁。moves 是頁面裡一張一張的小卡。dia 是示意圖代號。 */
const SECTIONS = [
{id:"warm", name:"熱身", time:"18:00–18:20", color:"#d9572b",
 notes:["18:20 一到就停，沒做完的直接跳過，接基本功。","人多時分兩隊：一隊從這邊底線、一隊從對面底線，同時往中線做，只到中線，不跑過去對面。"],
 items:[
 {id:"dyn", name:"動態熱身", cnt:"約 6 分鐘", brief:"WGS、抱膝走、殭屍走、衝刺倒退跑、側併步、交叉步",
  moves:[
   {n:"全世界最好的伸展 WGS", c:"原地 左右各 3 下", p:["右腳往前跨一大步成弓箭步，左膝可以輕碰地","雙手撐在右腳內側，右手肘往下壓向右腳跟","右手往天花板打開，眼睛跟著手看；動作慢，每個位置停 1 秒"]},
   {n:"抱膝走", c:"*1", p:["往前走一步，另一腳膝蓋抬到胸前，雙手抱住小腿往胸口拉","支撐腳踮腳尖，身體挺直","走到中線，回程慢跑，手臂一邊往前繞圈"]},
   {n:"殭屍走（直腿踢走）", c:"*1", p:["雙手往前平舉，膝蓋打直往上踢，用腳尖碰手掌","上半身挺直，不要彎腰去迎腳；先求腿直，不求踢高","回程慢跑，手臂一邊往後繞圈"]},
   {n:"衝刺、倒退跑摸線", c:"*1", p:["底線出發 → 往前衝到三米線，摸線","倒退跑回底線，摸線 → 再往前衝到中線，摸線，結束","先用七、八成力；倒退跑到底線要煞車時，重心壓低，免得往後跌"], dia:"route:run"},
   {n:"側併步摸線", c:"*1", p:["路線一樣：三米線摸線 → 回底線摸線 → 中線摸線","身體一直面向同一邊，不用轉身：去的時候往右移，回來往左移","重心放低、速度快，兩腳不要碰在一起，就像攔網的螃蟹走"], dia:"route:side"},
   {n:"交叉步", c:"來回 *1", p:["側身移動，後腳輪流從前面、後面交叉","肩膀保持朝同一個方向，只有臀部跟著腳轉","走到中線再走回來，不用摸線"]}
  ]},
 {id:"ladder", name:"繩梯", cnt:"約 5 分鐘", brief:"抬腿跑、交替腳橫移，再加輪換一項",
  flow:["會跳的人：沿著場上的線跑，用標誌盤標起點和終點，不用排隊","還不熟的人：用繩梯，比較看得清楚腳要踩哪裡","第一趟求對，第二趟求快；踩錯沒關係，繼續往前","沿著線跑沒有格子：步子小、踩得快，比跑得遠重要"],
  moves:[
   {n:"抬腿跑", tag:"每天", c:"*2", p:["每格踩一腳，左右交替","膝蓋抬到腰的高度，身體挺直不後仰","用前腳掌落地，腳步輕、頻率快，手臂跟著擺"], dia:"ladder:knee", dia2:"pose:knee"},
   {n:"交替腳橫移", tag:"每天", c:"左右各 *1", p:["站在繩梯旁邊、面向繩梯，身體跟繩梯成 90 度（腳尖朝繩梯）","橫著往旁邊移：一腳進、另一腳進，一腳出、另一腳出，每次往旁邊移一格","保持微蹲、重心低，眼睛看前方；回程換另一邊的腳先走"], dia:"ladder:side"},
   {n:"滑雪步", tag:"輪換", c:"*2", p:["雙腳併攏，一起跳：格內 → 右邊格外 → 格內 → 左邊格外，往前推進","膝蓋微彎，上半身保持朝前","落地輕，腳尖先著地"], dia:"ladder:ski"},
   {n:"開合單腳跳", tag:"輪換", c:"*2", p:["格內單腳落地 → 下一格兩腳張開踩在格外 → 再下一格換另一腳單腳","單腳落地要站穩，膝蓋不要往內夾","先求穩再求快"], dia:"ladder:hop"},
   {n:"雙腳 Z 型跑", tag:"輪換", c:"*2", p:["雙腳一起，斜斜跳進格子、再斜斜跳到另一邊格外，像寫 Z 字往前","腳步小而快，重心保持在中間"], dia:"ladder:zig"}
  ],
  warn:"腳印是照隊上舊卡片的文字畫的，還沒跟大家實際的跳法對過；跟教練教的不一樣時，以教練為準。"},
 {id:"jump", name:"起跳", cnt:"約 3 分鐘", brief:"由輕到重：下蹲定住、小腿跳、屈膝跳、下蹲跳",
  flow:["順序由輕到重：先學煞住，再學彈起來，最後才跳高"],
  moves:[
   {n:"快速下蹲定住", c:"*5", p:["踮腳尖、雙手往上伸直，把身體拉到最高","瞬間雙手往後甩、蹲成半蹲停住 2 秒","膝蓋對準腳尖不內夾，屁股往後坐、胸口往前"], dia:"pose:hold"},
   {n:"小腿跳", c:"*10", p:["原地用腳尖連續小跳，膝蓋微微彎","碰到地板就馬上彈起來，不求跳高","腳跟不著地，落地聲音要輕"]},
   {n:"屈膝跳", c:"*3", p:["往上跳，在空中把膝蓋往胸口收","落地膝蓋彎、輕輕落地，站穩再跳下一下","落地會晃、膝蓋內夾的人，先跳過這一項"]},
   {n:"下蹲跳下蹲", c:"*3", p:["蹲下馬上往上跳，不要停","落地直接蹲回去、定住 2 秒"], dia:"pose:jump"}
  ],
  src:"參考：教練傳的跳躍訓練影片（助跑跳沒有比較高）"},
 {id:"ball", name:"用球熱身", cnt:"約 5 分鐘", brief:"砸地板、自拋扣地板對面接",
  moves:[
   {n:"原地砸地板", c:"*10", p:["不用拋，過肩把球往地上砸","前幾下五成力，慢慢加到全力，把肩膀熱開"]},
   {n:"自拋扣地板、對面接", c:"做到時間到", p:["兩人一顆球、面對面：一個人自己拋，往兩人中間的地板扣，球彈一次飛到對面","對面接住後，換她自拋扣回來，一直輪流","扣的人只要做到：手舉高拍到球、手掌張開包住球、有「啪」一聲；先不管遠近"]}
  ]},
 {id:"late", name:"晚到的人", cnt:"約 5 分鐘", brief:"一個人就能做的短版，做完加入大家",
  moves:[
   {n:"WGS", c:"左右各 3 下", p:["同動態熱身的第一項"]},
   {n:"衝刺、倒退跑摸線", c:"*1", p:["三米線 → 底線 → 中線，每個折返點摸線","先用七、八成力，身體還沒熱開，大腿後側容易拉傷"]},
   {n:"側併步摸線", c:"*1", p:["路線一樣，重心低、速度快"]},
   {n:"快速下蹲定住", c:"*5", p:["瞬間蹲成半蹲停 2 秒"]},
   {n:"下蹲跳下蹲", c:"*3", p:["落地蹲回去定住"]},
   {n:"網球對網子丟", c:"約 10 下", p:["拿一顆網球，像揮臂一樣往網子丟","由輕到重，把肩膀熱開"]}
  ],
  flow:["做完直接加入大家正在練的那一段，不用從頭補"]}
 ]},
{id:"basic", name:"基本功", time:"18:20–18:40", color:"#2f8a4a",
 notes:["兩人一組，高手、低手各 10 分鐘。","每種都有三個階段，自己判斷：穩了就往下一個階段，累了可以休息。同一組兩個人可以在不同階段。","教練看到妳穩了，會叫妳往下一個階段。"],
 items:[
 {id:"hi", name:"高手對傳", cnt:"10 分鐘", brief:"彈地接住推 → 接住推 → 連續對傳",
  moves:[
   {n:"讓球彈地一次，接住再推", p:["對方傳過來的球先在地上彈一次","用高手接住、停一下，再推到對方手上"]},
   {n:"接住，直接推到對方手上", p:["不彈地，球來就用高手接住","接穩了再推出去，推到對方手上"]},
   {n:"連續對傳", p:["不接住，直接連續傳","傳不準就移動到球下面，不要伸手去撈"]}
  ],
  tips:["手型像一個碗，放在額頭前上方","等球掉進手裡再推，先接穩再推","前後腳、膝蓋微蹲，推的時候腳也一起往上送"]},
 {id:"lo", name:"低手對墊", cnt:"10 分鐘", brief:"摸地板彈地接 → 摸地板接 → 連續對墊",
  moves:[
   {n:"摸地板，讓球彈地一次再接", p:["每次球來，先蹲下摸地板","讓球在地上彈一次，再墊回對方手上"]},
   {n:"摸地板，直接接", p:["一樣先摸地板，不讓球彈地，直接接起來"]},

   return {svg:wrapCourt(g,"攔網接力站法"), cap:"A 隊從最左邊、B 隊從最右邊出發。邊線外的三角形是標誌盤，上面放網球；到邊線蹲下拿球，馬上起跳把球壓過網，再走回另一邊做一樣的事，回到起點拍下一個人。"}; },
 set3(){ let g = courtBase();
   g += tok(4.5,6.2,"拋","#0f766e") + tok(6.2,0.8,"舉",BLUE,{cls:"fpx"}) + tok(1.2,1.6,"接","#b45309");
   g += arr([[6.0,1.6],[4.9,5.3]],BLUE) + lbl(5.9,3.6,"① 跑過來摸球",{a:"start",fs:10,b:1,col:BLUE});
   g += arr([[4.3,5.5],[5.6,1.6]],BLUE,{dash:1}) + lbl(3.9,3.9,"② 退回網前",{a:"end",fs:10,b:1,col:BLUE});
   g += arr(qd(4.5,5.7,5.6,3.8,6.0,1.2),"#0f766e",{dash:1}) ;
   g += arr(qd(6.0,0.6,3.8,0.0,1.6,1.2),"#ea580c") + lbl(4.5,-1.0,"③ 轉身面向 4 號位，接住再推",{fs:10,b:1,col:"#ea580c"});
   g += lbl(4.5,7.6,"拋球的人拿球站後中；舉球員退的途中才拋",{fs:10});
   return {svg:wrapCourt(g,"舉球組第三步：跑位轉身接"), cap:"① 舉球員從網前跑過來摸拋球的人手上的球 → ② 往網子退回去，途中對方把球拋出 → ③ 邊移動邊轉身面向 4 號位，接住再推給 4 號位的人。"}; },
 combo(){ let g = courtBase();
   g += disc(7.4,-2.4,"1") + disc(1.3,-7.2,"2") + disc(7.6,-7.6,"3");
   g += tok(4.5,7.2,"教",COACH) + `<rect x="${X(5.3)}" y="${Y(6.7)}" width="22" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>` + lbl(5.85,8.3,"球車",{fs:9});
   g += [3.5,2.7,1.9].map(x=>tok(x,7.2,"舉",BLUE,{r:9,fs:10})).join("");
   g += [3.4,4.2,5.0].map(y=>tok(0.4,y,"攻","#b45309",{r:9,fs:10})).join("");
   g += arr([[3.6,6.5],[5.9,1.2]],BLUE) + arr(qd(4.5,6.6,5.8,3.2,6.1,1.3),COACH,{dash:1});
   g += arr([[0.6,3.0],[1.3,1.1]],"#b45309") + arr(qd(6.1,0.9,3.7,0.1,1.5,0.8),BLUE,{dash:1});
   g += arr(qd(1.4,0.4,4.6,-1.8,6.9,-2.2),"#ea580c") + arr(qd(1.4,0.2,1.0,-3.6,1.3,-6.4),"#ea580c") + arr(qd(1.5,0.2,5,-4,7.1,-7.1),"#ea580c");
   g += lbl(4.5,-9.4,"1 小斜線網前　2 直線深處　3 大斜線深處",{fs:10,b:1}) + lbl(4.5,8.75,"舉球員排在教練旁邊；攻擊手在 4 號位排隊",{fs:10});
   return {svg:wrapCourt(g,"舉攻合練：三個標誌盤位置"), cap:"圓圈＝1 公尺內都算。教練拋 → 舉球員從教練旁邊跑上去舉 → 攻擊手推到三個標誌盤，都推到了才可以打。從 2 號位推就左右對調。"}; },
 dig(state){ const lib = state!=="nolib"; let g = courtBase();
   g += tok(4.5,-1.4,"教",COACH);
   g += tok(1.2,1.3,"大","#b45309") + tok(4.5,0.7,"中","#be123c") + tok(7.8,1.3,"舉",BLUE);
   g += tok(7.7,6.8,"舉",BLUE) + (lib ? tok(1.3,6.8,"自","#0f766e")+tok(4.5,7.6,"大","#b45309") : tok(1.3,6.8,"大","#b45309")+tok(4.5,7.6,"中","#be123c"));
   g += lbl(1.2,2.85,"4",{fs:10}) + lbl(4.5,2.2,"3",{fs:10}) + lbl(7.8,2.85,"2",{fs:10}) + lbl(1.3,8.35,"5",{fs:10}) + lbl(4.5,9.15,"6",{fs:10}) + lbl(7.7,8.35,"1",{fs:10});
   g += arr(qd(4.5,-0.6,4.8,0,4.6,0.2),"#be123c") + arr([[4.9,1.4],[4.9,3.1]],"#be123c",{dash:1}) + lbl(5.1,3.75,"跳完轉身，退到三米線",{a:"start",fs:10,b:1,col:"#be123c"});
   g += arr(qd(4.2,-1.0,3.0,2,1.8,6.0),COACH,{dash:1}) + lbl(2.2,4.3,"教練丟進後排",{a:"end",fs:10});
   g += lbl(4.5,-3.6,"教練先拋給攔中跳攔，再丟一球進後排",{fs:10});
   return {svg:wrapCourt(g,lib?"接扣站位：有自由":"接扣站位：沒有自由"), cap: lib ? "有自由：自由守 5 號位（斜線）、大砲守 6 號位；1 號位是舉球員。" : "沒有自由：大砲守 5 號位、攔中守 6 號位；1 號位是舉球員。"}; }
};
const COURT_LG = {
 dig:[["#b45309","大＝大砲"],["#be123c","中＝攔中"],[BLUE,"舉＝舉球員"],["#0f766e","自＝自由"],[COACH,"教＝教練"]],
 combo:[[BLUE,"舉＝舉球員"],["#b45309","攻＝攻擊手"],[COACH,"教＝教練"]],
 set3:[["#0f766e","拋球的人"],[BLUE,"舉球員"],["#b45309","4 號位接球的人"]],
 relay:[[BLUE,"A 隊"],[PURP,"B 隊"],["#f59e0b","標誌盤＋網球"]],
 shuffle:[[BLUE,"這邊"],[PURP,"對面"]]
};

/* ===================== 播放器（腳印一步一步亮） ===================== */
const PL = {}; let plSeq = 0;
function stepDia(data, extraTop){
  const id = "p"+(++plSeq);
  PL[id] = {n:data.steps.length, k: reduceMotion() ? data.steps.length-1 : 0, playing: !reduceMotion(), slow:false, steps:data.steps, timer:null, hold:0};
  return `<div class="dia" data-pl="${id}">${extraTop||""}${data.svg}<div class="cap" aria-live="polite"></div>
  <div class="lg"><span><i style="background:${FOOT_L}"></i>左腳</span><span><i style="background:${FOOT_R}"></i>右腳</span>${data.pair?"<span>同一個數字＝兩腳一起</span>":""}<span>數字＝順序</span></div>
  <div class="ctl"><button class="btn" data-a="pl:${id}:prev" aria-label="上一步">‹ 上一步</button><button class="btn" data-a="pl:${id}:play"></button><button class="btn" data-a="pl:${id}:next" aria-label="下一步">下一步 ›</button><button class="btn" data-a="pl:${id}:slow" aria-pressed="false">慢速</button></div></div>`;
}
function plPaint(id){
  const s = PL[id], el = document.querySelector(`[data-pl="${id}"]`); if(!s || !el) return;
  el.querySelectorAll(".fp").forEach(g=>{ const k = +g.dataset.k; g.style.opacity = k<=s.k ? (k===s.k?1:.55) : .12; g.classList.toggle("cur", k===s.k); });
  el.querySelector(".cap").innerHTML = `<b>${s.k+1}／${s.n}</b>　${esc(s.steps[s.k])}`;
  el.querySelector(`[data-a="pl:${id}:play"]`).textContent = s.playing ? "⏸ 暫停" : "▶ 播放";
  el.querySelector(`[data-a="pl:${id}:slow"]`).setAttribute("aria-pressed", s.slow);
}
function plTick(){
  Object.keys(PL).forEach(id=>{ const s = PL[id]; if(!s.playing) return;
    if(!document.querySelector(`[data-pl="${id}"]`)){ delete PL[id]; return; }
    s.acc = (s.acc||0) + 1; if(s.acc < (s.slow?2:1)) return; s.acc = 0;
    if(s.k >= s.n-1){ if(++s.hold < 2) return; s.hold = 0; s.k = 0; } else s.k++;
    plPaint(id); });
}
setInterval(plTick, 900);
function plAct(id, a){
  const s = PL[id]; if(!s) return;
  if(a==="play"){ s.playing = !s.playing; if(s.playing && s.k>=s.n-1){ s.k=0; } s.hold=0; s.acc=0; }
  if(a==="prev"){ s.playing=false; s.k = Math.max(0, s.k-1); }
  if(a==="next"){ s.playing=false; s.k = Math.min(s.n-1, s.k+1); }
  if(a==="slow"){ s.slow = !s.slow; }
  plPaint(id);
}

function diaHTML(code){
  if(!code) return "";
  const [t,k] = code.split(":");
  if(t==="ladder") return stepDia(ladderSVG(k));
  if(t==="tape") return stepDia(tapeSVG());
  if(t==="pose") return poseSeq(k);
  if(t==="route" || t==="court") return courtDia(k);
  return "";
}
const COURT_STATE = {};
function courtDia(k, state){
  const sw = k==="dig" ? `<div class="seg" role="group" aria-label="有沒有自由"><button class="btn" data-a="cs:dig:lib" aria-pressed="${state!=="nolib"}">有自由</button><button class="btn" data-a="cs:dig:nolib" aria-pressed="${state==="nolib"}">沒有自由</button></div>` : "";
  const d = COURT[k](state);
  const lg = COURT_LG[k] ? `<div class="lg">${COURT_LG[k].map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")}</div>` : "";
  return `<div class="dia" data-court="${k}">${sw}${d.svg}${lg}<div class="cap" style="text-align:left">${d.cap}</div></div>`;
}

/* ===================== 畫面 ===================== */
const $ = s => document.querySelector(s);
const secById = id => SECTIONS.find(s=>s.id===id);
function topbar(title, backTo, backName){ return `<div class="top"><button class="back" data-go="${backTo}">‹ ${esc(backName)}</button><h1>${esc(title)}</h1></div>`; }
function footer(){ return `<div class="foot"><button class="lk" data-go="help">使用說明・安裝</button><br>練球手冊　版本 ${VERSION}<br>© 2026 Ken Chen｜免費使用｜有問題請截圖（附版本號）給教練</div>`; }
function ul(arr, ord){ return `<${ord?"ol":"ul"}>${arr.map(x=>`<li>${x}</li>`).join("")}</${ord?"ol":"ul"}>`; }

function viewHome(){
  return `<div class="hero"><div class="t">練球手冊</div><div class="s">社工女排｜練球前先看過，練完回來複習</div></div>
  <button class="btn pri" data-go="today">今天的流程 <small>${esc(TODAY.date)}</small></button>
  <h2>每一段怎麼練</h2>
  ${SECTIONS.map(s=>`<button class="tile" data-go="s/${s.id}"><span class="bar" style="background:${s.color}"></span><span class="m"><span class="n">${esc(s.name)}<small>${s.time}</small></span><span class="d">${s.items.length ? s.items.map(i=>esc(i.name)).join("、") : esc(s.notes[0])}</span></span><span class="go">打開 ›</span></button>`).join("")}
  ${footer()}`;
}
function viewToday(){
  return topbar(`今天的流程　${TODAY.date}`,"","首頁") + `<p style="color:var(--ink2);margin:6px 0 10px">練球時聽教練講；這裡給大家先看過順序。點一段可以看怎麼練。</p>
  <div class="plan">${TODAY.rows.map(([t,id,n,m,d])=>{ const s = secById(id); return `<button class="pl" data-go="s/${id}"><span class="tm">${t}</span><span class="bar" style="background:${s?s.color:"#999"}"></span><span class="m"><span class="n">${esc(n)}<small>${m}</small></span><br><span class="d">${esc(d)}</span></span><span class="go">›</span></button>`; }).join("")}</div>
  <div class="note" style="--c:#d9572b"><b>晚到的人</b>：先做 5 分鐘的熱身短版，做完直接加入大家正在練的那一段。<br><button class="btn sm" style="margin-top:8px" data-go="i/warm/late">看熱身短版 ›</button></div>
  ${footer()}`;
}
function viewSection(id){
  const s = secById(id); if(!s) return viewHome();
  const idx = SECTIONS.indexOf(s), nx = SECTIONS[idx+1];
  return topbar(s.name,"","首頁") + `<div style="color:var(--ink2);font-weight:700">${s.time}</div>
  <div class="note" style="--c:${s.color}">${s.notes.map(n=>`<p>${n}</p>`).join("")}</div>
  ${s.items.length?`<h2>點一項看怎麼練</h2>`:""}
  ${s.items.map(it=>`<button class="tile" data-go="i/${s.id}/${it.id}"><span class="bar" style="background:${s.color}"></span><span class="m"><span class="n">${esc(it.name)}${it.cnt?`<small>${esc(it.cnt)}</small>`:""}</span><span class="d">${esc(it.brief||"")}</span></span><span class="go">打開 ›</span></button>`).join("")}
  ${nx?`<button class="btn navnext" data-go="s/${nx.id}">下一段：${esc(nx.name)} ›</button>`:""}${footer()}`;
}
function moveCard(m, i, total, color){
  return `<div class="mv" style="--c:${color}"><div class="hd">${total>1?`<span class="num">${i+1}</span>`:""}<span class="nn">${esc(m.n)}</span>${m.tag?`<span class="tg">${esc(m.tag)}</span>`:""}${m.c?`<span class="cnt">${esc(m.c)}</span>`:""}</div>${m.p?ul(m.p):""}${diaHTML(m.dia)}${diaHTML(m.dia2)}</div>`;
}
function viewItem(sid, iid){
  const s = secById(sid), it = s && s.items.find(x=>x.id===iid); if(!it) return viewSection(sid);
  const i = s.items.indexOf(it), nx = s.items[i+1], nsec = SECTIONS[SECTIONS.indexOf(s)+1];
  let h = topbar(it.name, "s/"+s.id, s.name) + (it.cnt?`<div style="color:var(--ink2);font-weight:700">${esc(it.cnt)}</div>`:"");
  if(it.fig){ // 體能
    h += `<div class="sect" style="--c:${s.color}">${fig(it.fig)}<h3 style="margin-top:10px">怎麼做</h3>${ul(it.p)}<h3 style="margin-top:8px">哪裡痠才對</h3><p>${esc(it.s)}</p><h3 style="margin-top:8px">太難的簡單版</h3><p>${esc(it.e)}</p></div>`;
  } else {
    if(it.flow) h += `<div class="sect" style="--c:${s.color}"><h3>怎麼練</h3>${ul(it.flow, it.flow.length>2 && !it.moves)}${it.dia?diaHTML(it.dia):""}</div>`;
    else if(it.dia) h += diaHTML(it.dia);
    if(it.moves) h += it.moves.map((m,k)=>moveCard(m,k,it.moves.length,s.color)).join("");
    if(it.rules) h += `<div class="sect" style="--c:${s.color}"><h3>規則</h3>${ul(it.rules)}</div>`;
    if(it.tips) h += `<div class="sect" style="--c:${s.color}"><h3>要領</h3>${ul(it.tips)}${it.src?`<div class="src">${esc(it.src)}</div>`:""}</div>`;
    else if(it.src) h += `<div class="src">${esc(it.src)}</div>`;
    if(it.warn) h += `<div class="warn">${esc(it.warn)}</div>`;
  }
  if(nx) h += `<button class="btn navnext" data-go="i/${s.id}/${nx.id}">下一項：${esc(nx.name)} ›</button>`;
  else if(nsec) h += `<button class="btn navnext" data-go="s/${nsec.id}">下一段：${esc(nsec.name)} ›</button>`;
  return h + footer();
}
function viewHelp(){
  return topbar("使用說明","","首頁") + `<div class="sect"><h3>怎麼用</h3><ol><li>首頁點一段（例如「熱身」），看裡面有哪幾項</li><li>再點一項，看怎麼練、要領和示意圖</li><li>腳印示意圖會自己一步一步亮；按「暫停」「上一步」「下一步」可以慢慢看，「慢速」會放慢</li><li>練球時聽教練講，這裡是給大家<b>先預習、回家複習</b>用的</li></ol></div>
  <div class="sect"><h3>加到手機主畫面</h3><ul><li><b>iPhone、iPad</b>：用 Safari 打開 → 下面的「分享」→「加入主畫面」</li><li><b>Android</b>：用 Chrome 打開 → 右上角「⋮」→「加到主畫面」或「安裝應用程式」</li><li><b>電腦、Chromebook</b>：用 Chrome 或 Edge 打開 → 網址列右邊的安裝圖示</li><li><b>從 LINE 打開的</b>：先點右上角「⋯」→ 用瀏覽器開啟，再照上面加入</li></ul><p style="margin-top:6px">加過以後沒有網路也打得開。</p></div>
  <div class="sect"><h3>有問題</h3><p>畫面截圖給教練，記得截到最下面的版本號（目前 ${VERSION}）。</p></div>` + footer();
}

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,"")), p = h.split("/");
  Object.keys(PL).forEach(k=>delete PL[k]);
  let html;
  if(p[0]==="today") html = viewToday();
  else if(p[0]==="help") html = viewHelp();
  else if(p[0]==="s") html = viewSection(p[1]);
  else if(p[0]==="i") html = viewItem(p[1], p[2]);
  else html = viewHome();
  $("#app").innerHTML = `<div class="${p[0]?"":"home"}">${html}</div>`;
  Object.keys(PL).forEach(plPaint);
  window.scrollTo(0,0);
  const sec = p[0]==="s"||p[0]==="i" ? secById(p[1]) : null;
  document.title = sec ? `${sec.name}｜練球手冊` : "練球手冊";
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if(g){ const to = g.dataset.go; if(("#"+to)===location.hash || (to==="" && !location.hash.replace("#",""))) route(); else location.hash = to ? to : ""; if(to==="") history.replaceState(null,"",location.pathname+location.search); return; }
  const a = e.target.closest("[data-a]"); if(!a) return;
  const [t,x,y] = a.dataset.a.split(":");
  if(t==="pl") plAct(x,y);
  if(t==="cs"){ const box = a.closest("[data-court]"); box.outerHTML = courtDia(x,y); }
});
window.addEventListener("hashchange", route);
window.addEventListener("scroll", ()=>{ const t = $(".top"); if(t) t.classList.toggle("sh", window.scrollY>4); }, {passive:true});
route();
/* 自動測試時把錯誤丟出來 */
if(navigator.webdriver) window.addEventListener("error", e=>{ document.title = "ERROR: " + e.message; });

/* 離線和更新 */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound", ()=>{ const w = reg.installing; if(!w) return;
      w.addEventListener("statechange", ()=>{ if(w.state==="activated" && hadCtrl) showUpd(); }); });
  }).catch(()=>{});
}
function showUpd(){ if($(".upd")) return; const b = document.createElement("button"); b.className="upd"; b.textContent="有新版本，按這裡更新"; b.onclick=()=>location.reload(); document.body.appendChild(b); }
</script>
